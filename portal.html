<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portal do cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<style>
:root{--ink:#1A1033;--vi:#6B3DFF;--vi2:#EDE6FF;--mut:#6C6486;--ok:#0FA37F;--ok2:#D5F5EA;--co:#FF6B4A;--co2:#FFE3DB;--bd:#E0D8F2;--fld:#F1ECFB;--f:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--fd:"Bricolage Grotesque",var(--f)}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--ink);font:15px/1.5 var(--f);min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;width:460px;height:460px;border-radius:44% 56% 60% 40%;background:var(--vi);right:-150px;top:-250px}
.wrap{position:relative;max-width:820px;margin:0 auto;padding:22px 14px 40px}
.top{display:flex;align-items:center;gap:10px;color:#fff;font:700 20px var(--fd);letter-spacing:-.02em;margin:6px 4px 18px}
.top i{width:34px;height:34px;border-radius:38%;background:var(--vi);transform:rotate(-7deg);display:grid;place-items:center}
.card{background:#FBFAFF;border-radius:30px;padding:24px;margin-bottom:16px}
h1{font:700 clamp(26px,5vw,36px)/1.1 var(--fd);letter-spacing:-.03em;margin:0 0 6px}h2{font:700 19px var(--fd);margin:0 0 12px}
.sub{color:var(--mut);margin:0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.kp div{background:var(--fld);border-radius:20px;padding:12px 16px}.kp span{font-size:12.5px;color:var(--mut)}.kp b{display:block;font:700 20px var(--fd)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .t{min-width:0;flex:1}.row .t b{display:block}.row .t small{color:var(--mut)}
.bg{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}.bg.pago{background:var(--ok2);color:var(--ok)}.bg.pendente{background:var(--vi2);color:var(--vi)}.bg.atrasado{background:var(--co2);color:var(--co)}
button{font:inherit;font-weight:600;border:0;border-radius:99px;padding:9px 18px;background:var(--vi2);color:var(--vi);cursor:pointer}button.p{background:var(--vi);color:#fff}button:disabled{opacity:.5;cursor:default}
input[type=text]{font:inherit;width:100%;background:#fff;border:2px solid var(--bd);border-radius:14px;padding:11px 14px}input[type=text]:focus{outline:0;border-color:var(--vi)}
pre{white-space:pre-wrap;word-wrap:break-word;font:14px/1.6 var(--f);background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;max-height:340px;overflow:auto;margin:10px 0}
.ok{color:var(--ok);font-weight:600}.empty{color:var(--mut);padding:8px 0}
label.ck{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px}label.ck input{margin-top:4px}
.msg{color:#fff;text-align:center;padding:60px 10px}.msg h1{color:#fff}.foot{color:#9F93C9;text-align:center;font-size:12.5px;margin-top:10px}
@media(max-width:560px){.kp{grid-template-columns:1fr}.card{padding:18px;border-radius:26px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></i><span id="own">Portal do cliente</span></div>
  <div id="app"><div class="msg"><p>Carregando...</p></div></div>
  <p class="foot">Acesso exclusivo com o seu link. Não compartilhe com outras pessoas.</p>
</div>
<script>
// ====== CONFIGURE AQUI: os mesmos dados do seu sistema ======
const SUPABASE_URL="https://keoigxrqybkxktpvuuoj.supabase.co";
const SUPABASE_KEY="sb_publishable_B9FUEQRyXw8o1OkvUaP6SQ_BXCIMdMB";
// ============================================================
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fd=d=>d?String(d).slice(0,10).split("-").reverse().join("/"):"";
const fdt=d=>d?new Date(d).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"";
const TD=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const kb=b=>b>1048576?(b/1048576).toFixed(1)+" MB":Math.ceil((b||0)/1024)+" KB";
let sb,TOKEN="",DATA=null;
const stt=s=>s.status==="pago"?["pago","Pago"]:(s.due&&s.due<TD()?["atrasado","Em atraso"]:["pendente","A pagar"]);
function fail(t,m){$("#app").innerHTML=`<div class="msg"><h1>${t}</h1><p>${m}</p></div>`}
async function load(){
  TOKEN=decodeURIComponent((location.hash||"").replace(/^#/,"")).trim();
  if(TOKEN.length<40)return fail("Link inválido","Peça um novo link para quem enviou este portal.");
  if(typeof supabase==="undefined")return fail("Sem conexão","Não foi possível carregar a página. Verifique a internet e tente de novo.");
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
  const{data,error}=await sb.rpc("portal_get",{p_token:TOKEN});
  if(error)return fail("Algo deu errado","Não foi possível abrir o portal agora. Tente novamente em alguns minutos.");
  if(!data)return fail("Link inválido ou expirado","Peça um novo link para quem enviou este portal.");
  DATA=data;draw();
}
function draw(){
  const d=DATA,sv=d.services||[],tot=sv.reduce((a,s)=>a+Number(s.value),0),pg=sv.filter(s=>s.status==="pago").reduce((a,s)=>a+Number(s.value),0);
  if(d.owner)$("#own").textContent=d.owner;document.title=(d.owner?d.owner+" • ":"")+"Portal do cliente";
  const ct=(d.contracts||[]);
  $("#app").innerHTML=`<div class="card"><p class="sub">Olá,</p><h1>${esc(d.client.name)}</h1><p class="sub">Aqui você acompanha seus serviços, valores, arquivos e contratos.</p>
  <div class="kp"><div><span>Total dos serviços</span><b>${brl(tot)}</b></div><div><span>Já pago</span><b style="color:var(--ok)">${brl(pg)}</b></div><div><span>A pagar</span><b style="color:${tot-pg>0?"var(--co)":"inherit"}">${brl(tot-pg)}</b></div></div></div>
  ${ct.length?`<div class="card"><h2>Contratos</h2>${ct.map(k=>`<div style="margin-bottom:14px"><div class="row" style="border:0;padding:0"><div class="t"><b>${esc(k.title)}</b><small>${k.value?brl(k.value):""}</small></div><span class="bg ${k.status==="aceito"?"pago":"pendente"}">${k.status==="aceito"?"Aceito":"Aguardando seu aceite"}</span></div><pre>${esc(k.body)}</pre>${k.status==="aceito"?`<p class="ok">Aceito por ${esc(k.accepted_name)} em ${fdt(k.accepted_at)}.</p>`:`<label class="ck"><input type="checkbox" id="ck-${k.id}"> <span>Li o contrato e concordo com os termos.</span></label><input type="text" id="nm-${k.id}" placeholder="Digite seu nome completo para aceitar" style="margin-bottom:10px"><button class="p" data-ac="${k.id}">Aceitar contrato</button>`}</div>`).join("")}</div>`:""}
  <div class="card"><h2>Serviços</h2>${sv.map(s=>{const t=stt(s);return `<div class="row"><div class="t"><b>${esc(s.descr)}</b><small>${fd(s.date)}${s.due&&s.status!=="pago"?" • vence em "+fd(s.due):""}${s.status==="pago"&&s.paid_at?" • pago em "+fd(s.paid_at):""}</small></div><div style="text-align:right"><b>${brl(s.value)}</b><br><span class="bg ${t[0]}">${t[1]}</span></div></div>`}).join("")||'<p class="empty">Nenhum serviço registrado ainda.</p>'}</div>
  <div class="card"><h2>Arquivos</h2>${(d.files||[]).map(f=>`<div class="row"><div class="t"><b>${esc(f.name)}</b><small>${kb(f.size)}</small></div><button data-dl="${f.id}">Baixar</button></div>`).join("")||'<p class="empty">Nenhum arquivo disponível por enquanto.</p>'}</div>`;
}
document.addEventListener("click",async e=>{
  const dl=e.target.closest("[data-dl]"),ac=e.target.closest("[data-ac]");
  if(dl){const f=DATA.files.find(x=>x.id===dl.dataset.dl);dl.disabled=true;const{data,error}=await sb.storage.from("arquivos").createSignedUrl(f.path,300,{download:f.name});dl.disabled=false;if(error||!data)return alert("Não foi possível baixar este arquivo agora.");const a=document.createElement("a");a.href=data.signedUrl;a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
  if(ac){const id=ac.dataset.ac,nm=($("#nm-"+id).value||"").trim();if(!$("#ck-"+id).checked)return alert("Marque a caixa para confirmar que você leu o contrato.");if(nm.length<3)return alert("Digite seu nome completo.");
    ac.disabled=true;const{data,error}=await sb.rpc("portal_accept",{p_token:TOKEN,p_contract:id,p_name:nm});
    if(error||!data){ac.disabled=false;return alert("Não foi possível registrar o aceite. Atualize a página e tente de novo.")}
    await load()}
});
load();
</script>
</body>
</html>
